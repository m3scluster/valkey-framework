<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Valkey Control Plane cluster overview</title>
  <desc id="desc">Dark dashboard showing a running Valkey cluster with three active nodes, health, framework ID, and live server metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d12"/><stop offset="1" stop-color="#171329"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#211b35"/><stop offset="1" stop-color="#111722"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="250" height="900" fill="#0c1017"/>
  <path d="M250 0v900" stroke="#252b38"/>
  <g font-family="Arial, sans-serif" fill="#edf2f7">
    <g transform="translate(38 42)"><path d="m0 18 8-11 9 11 9-11 8 11-8 11-9-11-9 11Z" fill="none" stroke="#8c68e8" stroke-width="2"/><path d="m6 18 7-7 7 7-7 7Zm14 0 7-7 7 7-7 7Z" fill="#df5b8c"/><text x="54" y="15" font-size="15" font-weight="bold" letter-spacing="3">VALKEY</text><text x="54" y="34" font-size="10" fill="#818894" letter-spacing="1">CONTROL PLANE</text></g>
    <g font-size="14" fill="#8b929f"><rect x="22" y="132" width="206" height="44" rx="7" fill="#211c37"/><text x="38" y="160" fill="#d7caff">◈ Overview</text><text x="38" y="212">◌ Nodes</text><text x="38" y="264">⌁ Events</text></g>
    <text x="38" y="850" font-size="11" fill="#818894">●  Mesos connected</text>
    <text x="310" y="58" font-size="10" fill="#a18bd7" letter-spacing="2">PLATFORM / MESOS</text><text x="310" y="97" font-size="32" font-weight="bold">Cluster Overview</text><text x="1255" y="78" font-size="11" fill="#a18bd7">● LIVE　16:45</text>
    <rect x="310" y="135" width="1090" height="130" rx="10" fill="url(#hero)" stroke="#493b68"/><text x="342" y="168" font-size="10" fill="#a18bd7" letter-spacing="2">VALKEY CLUSTER</text><text x="342" y="211" font-size="34" font-weight="bold">Running</text><text x="342" y="238" font-size="13" fill="#9aa1ad">Managed by the Valkey Scheduler on Apache Mesos.</text><text x="1320" y="204" font-size="38" font-weight="bold" text-anchor="end" fill="#f08fb1">3<tspan font-size="20" fill="#a18bd7"> / 3</tspan></text><text x="1320" y="232" font-size="12" text-anchor="end" fill="#9aa1ad">active nodes</text>
  </g>
  <g font-family="Arial, sans-serif">
    <g fill="#1c1e26" stroke="#292f3a"><rect x="310" y="283" width="350" height="112" rx="9"/><rect x="680" y="283" width="350" height="112" rx="9"/><rect x="1050" y="283" width="350" height="112" rx="9"/></g>
    <g fill="#a18bd7" font-size="10" letter-spacing="2"><text x="335" y="312">HEALTH</text><text x="705" y="312">FRAMEWORK ID</text><text x="1075" y="312">DESIRED STATE</text></g>
    <g fill="#edf2f7" font-size="24" font-weight="bold"><text x="335" y="350">3 / 3</text><text x="705" y="350" font-size="17">valkey-framework-01</text><text x="1075" y="350">ON</text></g>
    <g fill="#79cfa8" font-size="12"><text x="335" y="376">● Mesos Connected</text></g><g fill="#929aa7" font-size="12"><text x="705" y="376">scheduler registration</text><text x="1075" y="376">controlled by scheduler</text></g>
    <text x="310" y="438" fill="#a18bd7" font-size="10" letter-spacing="2">VALKEY SDK</text><text x="310" y="466" fill="#edf2f7" font-size="18" font-weight="bold">Live server metrics</text><text x="1240" y="466" fill="#a18bd7" font-size="11">INFO via Valkey client</text>
    <g fill="#1c1e26" stroke="#292f3a"><rect x="310" y="487" width="350" height="190" rx="9"/><rect x="680" y="487" width="350" height="190" rx="9"/><rect x="1050" y="487" width="350" height="190" rx="9"/></g>
    <g fill="#a18bd7" font-size="10" letter-spacing="2"><text x="334" y="518">SERVER</text><text x="704" y="518">MEMORY</text><text x="1074" y="518">STATS</text></g>
    <g fill="#edf2f7" font-size="13"><text x="334" y="558">redis_version</text><text x="620" y="558" text-anchor="end">8.0.2</text><text x="334" y="600">uptime_in_seconds</text><text x="620" y="600" text-anchor="end">86,400</text><text x="704" y="558">used_memory_human</text><text x="990" y="558" text-anchor="end">12.4M</text><text x="704" y="600">used_memory_peak</text><text x="990" y="600" text-anchor="end">18.1M</text><text x="1074" y="558">connections_received</text><text x="1360" y="558" text-anchor="end">428</text><text x="1074" y="600">ops_per_sec</text><text x="1360" y="600" text-anchor="end">86</text></g>
    <rect x="310" y="710" width="1090" height="105" rx="9" fill="#1c1e26" stroke="#292f3a"/><text x="340" y="746" fill="#a18bd7" font-size="10" letter-spacing="2">DEPLOYMENT</text><text x="340" y="774" fill="#edf2f7" font-size="17" font-weight="bold">Scheduler-managed cluster</text><text x="340" y="797" fill="#9aa1ad" font-size="12">The scheduler starts and reconciles the Valkey deployment.</text><rect x="1190" y="748" width="150" height="42" rx="6" fill="#8d63dc"/><text x="1265" y="774" fill="white" font-size="13" text-anchor="middle">Start cluster</text>
  </g>
</svg>
